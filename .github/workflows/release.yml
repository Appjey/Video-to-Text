name: build-and-release

on:
  push:
    branches: [ "master" ]      # обычные пуши в master
    tags:     [ "v*" ]          # пуш тега вроде v1.2.3 запускает релиз
  workflow_dispatch: {}          # запуск вручную из UI

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11.8"
  APP_ENTRY: "stt_cli.py"
  APP_NAME: "stt_cli"

jobs:
  # ---------------------------
  # ГЕЙТ: решает, запускать ли сборку
  # Условия старта:
  #  - ручной запуск (workflow_dispatch)
  #  - пуш тега (refs/tags/*)
  #  - в любом сообщении коммита есть [release], release!, начинается с "release:" или содержит [build]
  # ---------------------------
  gate:
    name: Decide whether to run release
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      reason:     ${{ steps.decide.outputs.reason }}
    steps:
      - id: decide
        shell: bash
        run: |
          run="false"
          reason="no condition matched"

          # 1) Ручной запуск
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run="true"; reason="manual dispatch"
          # 2) Пуш тега
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            run="true"; reason="tag push ${GITHUB_REF}"
          else
            # 3) Ключевые слова в любом коммите этого пуша
            #    Используем jq для чтения payload (доступен на ubuntu-latest)
            msgs=$(jq -r '.commits[].message // empty' "$GITHUB_EVENT_PATH")
            if echo "$msgs" | grep -Eiq '\[release\]|(^|\s)release!|^release:|\[build\]'; then
              run="true"; reason="keyword in commit message"
            fi
          fi

          echo "should_run=$run"   >> "$GITHUB_OUTPUT"
          echo "reason=$reason"    >> "$GITHUB_OUTPUT"

      - name: Print decision
        run: |
          echo "should_run=${{ steps.decide.outputs.should_run }}"
          echo "reason=${{ steps.decide.outputs.reason }}"

  build-windows-x64:
    name: Build Windows x64 (spec + bundle CUDA DLLs)
    runs-on: windows-latest
    needs: [ gate ]
    if: needs.gate.outputs.should_run == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.8"

      - name: Install deps (app + PyInstaller)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper==1.2.0 ctranslate2==4.6.0 numpy==2.1.1 tqdm==4.66.5
          pip install pyinstaller==6.10.0

      - name: Build via spec
        shell: pwsh
        run: |
          pyinstaller stt_cli.spec
          if (!(Test-Path 'dist\stt_cli.exe')) { throw 'Build failed: dist\stt_cli.exe not found' }
          Get-ChildItem dist

      - name: Prepare package dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package\ffmpeg -Force | Out-Null
          Copy-Item "dist\stt_cli.exe" "package\stt_cli.exe"

      - name: Download FFmpeg (BtbN win64)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = Get-ChildItem -Recurse -Path ffmpeg | Where-Object { $_.Name -eq "ffmpeg.exe" } | Select-Object -First 1
          if (-not $bin) { throw "ffmpeg.exe not found in downloaded archive" }
          Copy-Item $bin.FullName "package\ffmpeg\ffmpeg.exe"

      # ⬇️ КЛЮЧЕВОЕ: ставим runtime-библиотеки CUDA/cuDNN и кладём DLL рядом с exe
      - name: Install NVIDIA CUDA/cuDNN runtime wheels
        shell: pwsh
        run: |
          # Версии совместимы с cuDNN v9 + CUDA 12.4 (для ctranslate2>=4.5)
          pip install nvidia-cublas-cu12==12.4.5.8 `
                      nvidia-cuda-runtime-cu12==12.4.127 `
                      nvidia-cuda-nvrtc-cu12==12.4.127 `
                      nvidia-cudnn-cu12==9.5.0.50
          # Находим site-packages\nvidia и вытягиваем все .dll из ...\bin
          $site = python -c "import site; print(site.getsitepackages()[0])"
          $nvdir = Join-Path $site.Trim() "nvidia"
          if (Test-Path $nvdir) {
            $bins = Get-ChildItem -Recurse -Path $nvdir -Filter *.dll | Where-Object { $_.FullName -match '\\bin\\' }
            foreach ($dll in $bins) {
              Copy-Item $dll.FullName "package\" -Force
            }
          } else {
            Write-Host "WARN: NVIDIA site-packages directory not found."
          }

      - name: Zip package
        shell: pwsh
        run: |
          Compress-Archive -Path package\* -DestinationPath "stt_cli-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stt_cli-windows-x64.zip
          path: stt_cli-windows-x64.zip
          if-no-files-found: error

  # Публикуем ARM64-совместимый артефакт как копию x64 (WoA эмулирует x64)
  package-windows-arm64-compat:
    name: Package Windows ARM64 (compat via x64)
    runs-on: ubuntu-latest
    needs:
      - gate
      - build-windows-x64
    if: needs.gate.outputs.should_run == 'true'
    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x64.zip
          path: release

      - name: Duplicate as ARM64 compat
        run: |
          cp "release/${APP_NAME}-windows-x64.zip" "release/${APP_NAME}-windows-arm64-compat.zip"
          ls -la release

      - name: Upload compat artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-arm64-compat.zip
          path: release/${{ env.APP_NAME }}-windows-arm64-compat.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - gate
      - build-windows-x64
      - package-windows-arm64-compat
    if: needs.gate.outputs.should_run == 'true'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Compose tag and name
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "TAG_NAME=auto-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Auto build $(date -u +%Y-%m-%dT%H:%MZ) (${GITHUB_SHA::7})" >> $GITHUB_ENV
          echo "TRIGGER_REASON=${{ needs.gate.outputs.reason }}" >> $GITHUB_ENV

      - name: Show files
        run: |
          ls -la release
          find release -type f -maxdepth 2 -print
          echo "Triggered by: $TRIGGER_REASON"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: true
          make_latest: false
          files: |
            release/${{ env.APP_NAME }}-windows-x64.zip/${{ env.APP_NAME }}-windows-x64.zip
            release/${{ env.APP_NAME }}-windows-arm64-compat.zip/${{ env.APP_NAME }}-windows-arm64-compat.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
